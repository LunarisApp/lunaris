name: Artifacts - Prepare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    if: vars.DELIVERY_MODE == 'trunk' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        family: [npm]
    concurrency:
      group: version-${{ matrix.family }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - id: pending
        env:
          FAMILY: ${{ matrix.family }}
        run: bun tooling/delivery/version-family.ts --pending "$FAMILY"
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        if: matrix.family == 'npm' && steps.pending.outputs.enabled == 'true'
        with:
          github-token: ${{ steps.app.outputs.token }}
          pr-base-branch: main
          version-script: bun tooling/delivery/version-family.ts npm && bun install --lockfile-only --ignore-scripts && bunx --no-install biome format --write .changeset .release packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
      - name: Prepare self-hosted version PR
        if: matrix.family == 'self-hosted' && steps.pending.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bun tooling/delivery/self-host-pr.ts
