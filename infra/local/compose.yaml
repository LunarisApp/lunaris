name: lunaris

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-lunaris-local}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lunaris-local}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: ../../apps/api/${LUNARIS_COMPOSE_ENV:-.env.development}
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    command:
      - postgres
      - -c
      - wal_level=logical
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts/00-create-db.sh:/docker-entrypoint-initdb.d/00-create-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 12

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    env_file: ../../apps/api/${LUNARIS_COMPOSE_ENV:-.env.development}
    environment:
      - PS_POSTGRES_SOURCE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      - PS_POSTGRES_BUCKET_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${PS_DATABASE_NAME}
      - PS_AUTH_AUD=${PS_AUDIENCE}
      - PS_AUTH_JWKS=http://host.docker.internal:3000/auth/jwks
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${POWERSYNC_HOST_PORT:-8080}:80"
    extra_hosts:
      # host.docker.internal is auto-provided on Docker Desktop but must be
      # wired explicitly on Linux docker.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/powersync.yaml:/app/powersync.yaml
      - ./config/sync_rules.yaml:/app/sync_rules.yaml

  garage:
    image: dxflrs/garage:v1.3.1
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_HOST_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_HOST_PORT:-3903}:3903"
    volumes:
      - garage_data:/var/lib/garage
      - ./config/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage-init:
    image: alpine:3.21
    depends_on:
      garage:
        condition: service_healthy
    env_file: ../../apps/api/${LUNARIS_COMPOSE_ENV:-.env.development}
    volumes:
      - ./init-scripts/init-garage.sh:/init-garage.sh:ro
    entrypoint: ["sh", "/init-garage.sh"]
    restart: "no"

volumes:
  pg_data:
  garage_data:
