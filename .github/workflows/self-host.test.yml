name: Self-host - Test
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  stack:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Release versioning creates a new commit after the triggering event.
      # Validate its provenance before executing any code from that checkout.
      - name: Select trusted release revision
        if: inputs.ref != github.sha
        env:
          RELEASE_SHA: ${{ inputs.ref }}
        shell: bash
        run: |
          if [[ ! $RELEASE_SHA =~ ^[0-9a-f]{40}$ ]] ||
             [[ $GITHUB_REF != refs/heads/main ]] ||
             [[ $GITHUB_EVENT_NAME != push && $GITHUB_EVENT_NAME != workflow_dispatch ]]; then
            echo 'Alternate revisions must be full release commit SHAs from main.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          git checkout --detach "$RELEASE_SHA"
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - uses: ./.github/actions/buildkit-runtime
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test isolated deployment
        run: bash tooling/self-host/test-stack.sh
      - name: Test external TLS proxy
        run: bash tooling/self-host/test-external-tls.sh
      - name: Test backend without web
        run: bash tooling/self-host/test-external-tls.sh --no-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: self-host-logs-${{ matrix.runner }}
          path: |
            .context/self-host-test.*/containers.log
            .context/self-host-external.*/containers.log
          retention-days: 7
          include-hidden-files: true
