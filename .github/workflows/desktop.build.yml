name: Desktop - Build Windows and Linux
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        default: ""
        type: string
      publish:
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Validate desktop source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      validated_revision: ${{ steps.source.outputs.validated_revision }}
    steps:
      # Keep validation on the workflow revision before executing the requested source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restrict source to the PR context or trunk history
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_BUILD: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Desktop source must be a full commit SHA' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "$RELEASE_BUILD" = true ] || [ "$SOURCE_REF" != "$EVENT_SHA" ]; then
              echo 'PR builds must use the current PR commit and cannot publish' >&2
              exit 1
            fi
          else
            git merge-base --is-ancestor "$SOURCE_REF" refs/remotes/origin/main
          fi
          sha="$(git rev-parse --verify "$SOURCE_REF^{commit}")"
          printf 'validated_revision=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    environment: ${{ inputs.publish && 'release' || '' }}
    permissions:
      contents: read
      actions: read
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            binary: lunaris-desktop.exe
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            binary: lunaris-desktop
    defaults:
      run:
        shell: bash
    env:
      CYPRESS_INSTALL_BINARY: 0
      PRODUCT_VERSION: ${{ inputs.version }}
      PRODUCT_GROUP: desktop-${{ matrix.platform }}
      LUNARIS_BUILD_SHA: ${{ needs.source.outputs.validated_revision }}
      LUNARIS_BUILD_VERSION: ${{ inputs.version }}
      VITE_REGION_DIRECTORY_URL: https://lunaris.app/.well-known/lunaris-regions
    steps:
      # Generated contracts are byte-checked against LF output on every platform.
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.validated_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .delivery-tools
          sparse-checkout: |
            tooling/delivery
            tooling/release/automation
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # Draft release assets require contents: write. Keep PR build tokens read-only.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: release-app
        if: inputs.publish
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Restore immutable release assets
        id: restore
        if: inputs.publish
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: bun .delivery-tools/tooling/delivery/product-release.ts restore dist
      - name: Install Linux build dependencies
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Fail on unavailable indexes instead of installing from stale metadata.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb libfuse2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.restore.outputs.cached != 'true'
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        if: steps.restore.outputs.cached != 'true'
        with:
          workspaces: .
          key: desktop-${{ matrix.target }}
      - name: Set isolated release version
        if: inputs.publish && steps.restore.outputs.cached != 'true'
        run: bun tooling/delivery/product-version.ts
      - name: Install license generator
        if: steps.restore.outputs.cached != 'true'
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Configure signed updater
        if: inputs.publish && steps.restore.outputs.cached != 'true'
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun .delivery-tools/tooling/delivery/desktop-updater-config.ts
      - name: Build installer and bundled sidecar
        if: steps.restore.outputs.cached != 'true'
        env:
          BUNDLER_GITHUB_TOKEN: ${{ github.token }}
          # Preserve Bun's embedded agent program through both linuxdeploy passes.
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
          PATCHELF: ${{ runner.os == 'Linux' && format('{0}/tooling/delivery/appimage-patchelf.sh', github.workspace) || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.publish && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.publish && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: bun .delivery-tools/tooling/delivery/bundle-downloads.ts bash .delivery-tools/tooling/delivery/retry-bundle.sh bun run --cwd apps/desktop tauri:build -- --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ inputs.publish && '--config ../../artifacts/desktop-updater.conf.json' || '' }}
      - name: Test native runtime
        if: steps.restore.outputs.cached != 'true'
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bun tooling/mcp-smoke.ts target/${{ matrix.target }}/release/${{ matrix.binary }} lunaris-desktop
          else
            bun tooling/mcp-smoke.ts target/${{ matrix.target }}/release/${{ matrix.binary }} lunaris-desktop
          fi
      - name: Inspect Debian package contents
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Linux'
        run: |
          packages=(target/${{ matrix.target }}/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --extract "${packages[0]}" "$RUNNER_TEMP/desktop-package"
          test -n "$(find "$RUNNER_TEMP/desktop-package" -type f -name lunaris-agent -size +0c -print -quit)"
          test -n "$(find "$RUNNER_TEMP/desktop-package" -type f -name RUST-LICENSES.txt -size +0c -print -quit)"
          test -n "$(find "$RUNNER_TEMP/desktop-package" -type f -name AGENT-${{ matrix.target }}-LICENSES.md -size +0c -print -quit)"
      - name: Inspect and smoke test AppImage
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Linux'
        run: |
          images=("$GITHUB_WORKSPACE"/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/desktop-appimage"
          cd "$RUNNER_TEMP/desktop-appimage"
          "${images[0]}" --appimage-extract > /dev/null
          cmp "$GITHUB_WORKSPACE/apps/desktop/src-tauri/binaries/lunaris-agent-${{ matrix.target }}" squashfs-root/usr/bin/lunaris-agent
          xvfb-run -a bun "$GITHUB_WORKSPACE/tooling/mcp-smoke.ts" "$PWD/squashfs-root/AppRun" lunaris-desktop
      - name: Install and smoke test Windows installer
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installPath = Join-Path $env:RUNNER_TEMP 'lunaris-installed'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$installPath" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          foreach ($name in @('lunaris-agent.exe', 'RUST-LICENSES.txt', 'AGENT-${{ matrix.target }}-LICENSES.md')) {
            $files = @(Get-ChildItem $installPath -Recurse -File -Filter $name | Where-Object Length -gt 0)
            if ($files.Count -eq 0) { throw "Missing installed resource: $name" }
          }
          bun tooling/mcp-smoke.ts "$installPath/lunaris-desktop.exe" lunaris-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package verified installer
        if: steps.restore.outputs.cached != 'true'
        run: bun .delivery-tools/tooling/delivery/desktop-artifacts.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.publish && 'release' || 'ci' }}-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
