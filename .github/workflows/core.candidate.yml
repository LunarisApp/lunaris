name: Core - Candidate
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  deployments: read
  packages: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      images: ${{ steps.images.outputs.images }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CORE_CONFIGURATION_REVISION: ${{ vars.CORE_CONFIGURATION_REVISION }}
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/cache-turbo
      - run: bun install --frozen-lockfile
      - id: plan
        run: bun tooling/delivery/core.ts plan
      - name: Validate core workspaces
        if: steps.plan.outputs.enabled == 'true'
        env:
          WORKSPACE_FILTERS: '["--filter=api...", "--filter=web..."]'
          LUNARIS_EDITION: enterprise
        run: |
          bun run check
          bun tooling/delivery/check-workspaces.ts typecheck
          bun tooling/delivery/check-workspaces.ts test
      - uses: ./.github/actions/buildkit-runtime
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.plan.outputs.enabled == 'true'
      - name: Authenticate registry
        if: steps.plan.outputs.enabled == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - id: images
        if: steps.plan.outputs.enabled == 'true'
        run: bun tooling/delivery/core.ts images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.plan.outputs.enabled == 'true'
        with:
          name: core-images
          path: artifacts/candidate.json
          retention-days: 30
  test:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2 ]
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.sha }}
      images: ${{ needs.build.outputs.images }}
      shard: ${{ matrix.shard }}
      shards: 3
  certify:
    needs: [ build, test ]
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-images
          path: artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-candidate
          path: artifacts/candidate.json
          retention-days: 30
