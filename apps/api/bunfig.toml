[test]
preload = ["./test/preload.ts"]
root = "."
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageThreshold = { line = 0.85, function = 0.69 }
coveragePathIgnorePatterns = [
  "dist/**",
  "test/**",
  "../../extensions/**",
  "../../internal/**",
  "../../packages/**",
  "src/**/__fixtures__/**",
  "src/**/fixtures/**",
  "src/**/generated/**",
  "src/**/*.generated.ts",
  "src/main.ts",
  "src/instrument.ts",
  "src/app.module.ts",
]
