<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link
      rel="icon"
      href="/favicon-light.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    >
    <link
      rel="icon"
      href="/favicon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    >
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta
      name="theme-color"
      content="#efeeeb"
      media="(prefers-color-scheme: light)"
    >
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    >
    <title>Lunaris</title>
    <style>
    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    :root {
      color-scheme: light dark;
    }

    .lunaris-initial-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      color: light-dark(#000, #f8f8f8);
      background: light-dark(#efeeeb, #000);
    }

    .lunaris-initial-spinner {
      box-sizing: border-box;
      width: 2rem;
      height: 2rem;
      border: 3px solid color-mix(in srgb, currentColor 20%, transparent);
      border-top-color: currentColor;
      border-radius: 9999px;
      animation: lunaris-initial-spin 0.8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .lunaris-initial-spinner {
        animation: none;
      }
    }

    @keyframes lunaris-initial-spin {
      to {
        transform: rotate(360deg);
      }
    }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        aria-busy="true"
        aria-label="Loading application"
        class="lunaris-initial-loader"
        role="status"
      >
        <div aria-hidden="true" class="lunaris-initial-spinner"></div>
      </div>
    </div>
    <div id="portal" class="fixed top-0 left-0 z-40"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
