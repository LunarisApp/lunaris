[unix_http_server]
file=/run/lunaris/supervisor.sock
chmod=0700
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/lunaris/supervisord.pid
childlogdir=/run/lunaris
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/lunaris/supervisor.sock

[program:postgres]
command=/opt/aio/postgres.sh
user=postgres
priority=10
autorestart=unexpected
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:redis]
command=redis-server /run/lunaris/redis.conf
user=redis
priority=20
autorestart=unexpected
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:garage]
command=garage -c /run/lunaris/garage.toml server
user=lunaris
priority=20
autorestart=unexpected
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:nginx]
command=nginx -g "daemon off;"
priority=30
autorestart=unexpected
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:api]
directory=/opt/lunaris/apps/api
command=bun dist/src/main.js
user=lunaris
autostart=false
priority=40
autorestart=unexpected
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:powersync]
directory=/app
command=node service/lib/entry.js start -r unified
user=lunaris
autostart=false
priority=50
autorestart=unexpected
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:watchdog]
command=python3 /opt/aio/watchdog.py
stopasgroup=true
killasgroup=true
autostart=false
priority=60
autorestart=true
stopwaitsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
