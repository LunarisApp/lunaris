[package]
name = "lunaris-agent-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Shared Lunaris agent contract and MCP stdio runtime"

[dependencies]
async-trait = "0.1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=0.15.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
