# Auth pages share a prefix with Better Auth. Only known GET/HEAD pages use
# the SPA; verification links with tokens and all mutations stay on the API.
map "$request_method:$uri" $auth_page {
    default 0;
    ~^(GET|HEAD):/auth(?:/(email|continue|register|forgot-password|reset-password|two-factor|verify-email|onboarding|accept-invitation|agent-consent))?/?$ 1;
}
map "$uri:$arg_token" $verification_link {
    default 0;
    ~^/auth/verify-email/?:.+ 1;
}
map "$auth_page:$verification_link" $serve_auth_page {
    default 0;
    "1:0" 1;
}

# The only published port. Never publish internal service ports.
server {
    listen 8080;
    server_name _;
    root /opt/lunaris/apps/web/dist;
    client_max_body_size 256m;
    include /run/lunaris/presence-origin.conf;
    include /opt/aio/security-headers.conf;
    # Runtime generated, same-origin region directory.
    location = /regions.json {
        alias /run/lunaris/regions.json;
        include /opt/aio/security-headers.conf;
        add_header Cache-Control "no-store";
    }
    # Exact matches take precedence over the API's .well-known routes below.
    location = /.well-known/lunaris-regions {
        alias /run/lunaris/regions.json;
        default_type application/json;
        include /opt/aio/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
    location = /.well-known/lunaris-servers {
        alias /run/lunaris/servers.json;
        default_type application/json;
        include /opt/aio/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
    location = /.well-known/security.txt {
        try_files $uri =404;
    }
    location / {
        include /run/lunaris/canonical-origin.conf;
        try_files $uri $uri/ /index.html;
        include /opt/aio/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(v1|auth|api|oauth2|\.well-known)(/|$) {
        if ($serve_auth_page) { rewrite ^ /index.html last; }
        proxy_pass http://127.0.0.1:3000;
        include /run/lunaris/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /sync/ {
        proxy_pass http://127.0.0.1:8082/;
        include /run/lunaris/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    # Preserve URI and Host: both are covered by S3 signatures.
    location /lunaris/ {
        proxy_pass http://127.0.0.1:3900;
        include /run/lunaris/proxy-headers.conf;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
