name: Self-host - Publish
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: write
  packages: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - id: release
        run: bun tooling/self-host/release.ts prepare
  images:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-bun
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build and push platform images by digest
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir -p artifacts
          revision=$(git rev-parse HEAD)
          for target in api web; do
            docker buildx build -f infra/self-host/Dockerfile --target "$target" \
              --platform "linux/$ARCHITECTURE" --build-arg LUNARIS_EDITION=community \
              --label "org.opencontainers.image.revision=$revision" \
              --label org.opencontainers.image.source=https://github.com/LunarisApp/lunaris \
              --output "type=image,name=ghcr.io/lunarisapp/lunaris-$target,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "artifacts/$target.json" .
          done
          # shellcheck disable=SC2016 # JavaScript template literals, not shell variables.
          SOURCE_COMMIT="$revision" bun -e '
            const read = async (s) => (await Bun.file(`artifacts/${s}.json`).json())["containerimage.digest"];
            await Bun.write("artifacts/images.json", JSON.stringify({sourceCommit: process.env.SOURCE_COMMIT, platform: `linux/${process.env.ARCHITECTURE}`, api: await read("api"), web: await read("web")}));
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-host-images-${{ matrix.architecture }}
          path: artifacts/images.json
  bundle:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: self-host-images-amd64
          path: artifacts/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: self-host-images-arm64
          path: artifacts/arm64
      - name: Authenticate container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Publish pinned deployment bundle
        run: bun tooling/self-host/release.ts publish artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
