name: Artifacts - Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
      sha: ${{ steps.select.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - id: select
        run: bun tooling/delivery/artifact-release.ts plan
        env:
          RELEASE_FAMILY: npm
  npm:
    needs: npm-plan
    if: needs.npm-plan.outputs.enabled == 'true'
    uses: ./.github/workflows/artifact.family.yml
    with:
      family: npm
      ref: ${{ needs.npm-plan.outputs.sha }}
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    secrets: inherit
