name: E2E

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      suite:
        type: string
        default: full
      shard:
        type: number
        default: 0
      shards:
        type: number
        default: 1
      images:
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ inputs.suite || 'full' }}-${{ inputs.shard || 0 }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: Browser suite
    runs-on: ubuntu-latest
    env:
      LUNARIS_EDITION: enterprise
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Free Bun install cache
        run: bun pm cache rm
      - name: Build public package dependencies
        run: bun run build --filter=@lunarisapp/plugin-sdk --filter=@lunarisapp/ui

      - name: Select specs
        id: specs
        run: bun tooling/delivery/e2e-specs.ts
        env:
          E2E_SUITE: ${{ inputs.suite || 'full' }}
          E2E_SHARD: ${{ inputs.shard || 0 }}
          E2E_SHARDS: ${{ inputs.shards || 1 }}

      - name: Seed API CI overrides
        run: |
          cp apps/api/.env.development apps/api/.env.e2e
          cat apps/api/.env.e2e.ci >> apps/api/.env.e2e
          cp apps/api/.env.e2e.ci apps/api/.env.local
          LUNARIS_COMPOSE_ENV=.env.e2e docker compose \
            --env-file apps/api/.env.e2e \
            -f infra/local/compose.yaml \
            config --quiet

      - name: Start API services (postgres, powersync, garage)
        run: |
          LUNARIS_COMPOSE_ENV=.env.e2e bun run services:up
          LUNARIS_COMPOSE_ENV=.env.e2e bun run services:init

      - name: Migrate API database
        if: inputs.images == ''
        run: bun --env-file=.env.e2e run db:migrate
        working-directory: apps/api

      - name: Build API
        if: inputs.images == ''
        run: bun run build
        working-directory: apps/api

      - name: Start API (stdout piped to log file for Cypress)
        if: inputs.images == ''
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          nohup bun run start:prod > "$GITHUB_WORKSPACE/logs/backend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/logs/backend.pid"
        working-directory: apps/api

      - name: Build production PWA
        if: inputs.images == ''
        run: bun run build
        env:
          VITE_ALLOW_INLINE_REGION_DIRECTORY: "true"
          VITE_REGION_DIRECTORY_JSON: '[{"id":"local","label":"Local","apiUrl":"http://localhost:3000","status":"active","default":true}]'
        working-directory: apps/web

      - name: Start preview servers and verify readiness
        if: inputs.images == ''
        run: |
          for port in 5173 4173; do
            nohup bun run --cwd apps/web preview -- --host 0.0.0.0 --port "$port" --strictPort > "logs/preview-$port.log" 2>&1 &
            echo $! > "logs/preview-$port.pid"
          done
          bun tooling/ci/readiness.ts http://127.0.0.1:3000/v1/health logs/backend.pid
          for port in 5173 4173; do
            bun tooling/ci/readiness.ts "http://127.0.0.1:$port" "logs/preview-$port.pid"
          done

      - name: Start candidate images
        if: inputs.images != ''
        env:
          CANDIDATE_IMAGES: ${{ inputs.images }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: bun tooling/delivery/e2e-images.ts

      - name: Run full Cypress E2E suite
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
        env:
          CYPRESS_BACKEND_LOG_PATH: ${{ github.workspace }}/logs/backend.log
        with:
          working-directory: apps/e2e
          install: false
          # Runner Chrome 155 crashes its network service during this suite.
          # Use the Chromium runtime bundled with the locked Cypress version.
          browser: electron
          spec: ${{ steps.specs.outputs.specs }}

      - name: Run returning-user offline PWA test
        if: inputs.suite != 'smoke' && inputs.shard == 0
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
        env:
          CYPRESS_BACKEND_LOG_PATH: ${{ github.workspace }}/logs/backend.log
          CYPRESS_BASE_URL: http://localhost:4173
          CYPRESS_PWA_OFFLINE: "true"
        with:
          working-directory: apps/e2e
          install: false
          # Runner Chrome 155 crashes its network service during this suite.
          # Use the Chromium runtime bundled with the locked Cypress version.
          browser: electron
          spec: cypress/e2e/offline/**/*.cy.ts

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: cypress-screenshots-${{ inputs.suite || 'full' }}-${{ inputs.shard || 0 }}
          path: apps/e2e/cypress/screenshots

      - name: Upload server logs on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-server-logs-${{ inputs.suite || 'full' }}-${{ inputs.shard || 0 }}
          path: logs/*.log

      - name: Dump service logs on failure
        if: failure()
        run: LUNARIS_COMPOSE_ENV=.env.e2e bun run services:logs

      - name: Stop candidate containers
        if: always() && inputs.images != ''
        run: docker rm -f lunaris-e2e-api lunaris-e2e-web-5173 lunaris-e2e-web-4173 || true

      - name: Stop E2E servers
        if: always()
        run: |
          for pid_file in logs/*.pid; do
            [ -f "$pid_file" ] || continue
            kill "$(cat "$pid_file")" 2>/dev/null || true
          done
