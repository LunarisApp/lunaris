name: Deploy / PowerSync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-powersync.yml
      - infra/local/config/powersync.yaml
      - infra/local/config/sync_rules.yaml
      - package.json
      - tooling/powersync-config.ts

concurrency:
  group: powersync-config-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.10

jobs:
  deploy:
    name: Production
    if: vars.RELEASE_AUTOMATION_ENABLED != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.26.4
      - name: Require Railway project token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing repository secret RAILWAY_TOKEN."
            exit 1
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy production config
        run: bun run powersync:config:deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POWERSYNC_API_SERVICE_ID: ${{ vars.POWERSYNC_API_SERVICE_ID }}
          POWERSYNC_COMPACT_SERVICE_ID: ${{ vars.POWERSYNC_COMPACT_SERVICE_ID }}
          POWERSYNC_ENVIRONMENT_ID: ${{ vars.POWERSYNC_ENVIRONMENT_ID }}
          POWERSYNC_PROJECT_ID: ${{ vars.POWERSYNC_PROJECT_ID }}
          POWERSYNC_REPLICATION_SERVICE_ID: ${{ vars.POWERSYNC_REPLICATION_SERVICE_ID }}
