name: Sites - Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    if: vars.DELIVERY_MODE == 'trunk' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        component: [landing, docs]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-${{ matrix.component }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_RELEASE_TOKEN }}
      RAILWAY_RELEASE_TARGETS: ${{ vars.RAILWAY_RELEASE_TARGETS }}
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/cache-turbo
      - run: bun install --frozen-lockfile
      - id: plan
        env:
          COMPONENT: ${{ matrix.component }}
        run: bun tooling/delivery/deploy-sites.ts "$COMPONENT" --plan
      - name: Validate component
        if: steps.plan.outputs.enabled == 'true'
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          bun run check
          bun run typecheck --filter="$COMPONENT"
          bun run test --filter="$COMPONENT"
          bun run build --filter="$COMPONENT"
      - run: npm install --global @railway/cli@5.26.4
        if: steps.plan.outputs.enabled == 'true'
      - name: Deploy component
        if: steps.plan.outputs.enabled == 'true'
        env:
          COMPONENT: ${{ matrix.component }}
        run: bun tooling/delivery/deploy-sites.ts "$COMPONENT"
