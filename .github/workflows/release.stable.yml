name: Release Stable
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful private staging candidate run ID
        required: true
        type: string
      version:
        description: Stable version override; defaults to next product patch
        type: string
concurrency:
  group: stable-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reserve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
      checks: read
      deployments: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      sha: ${{ steps.reserve.outputs.sha }}
      complete: ${{ steps.reserve.outputs.complete }}
      homebrew_enabled: ${{ steps.distribution.outputs.homebrew_enabled }}
    env:
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CORE_CONFIGURATION_REVISION: ${{ vars.CORE_CONFIGURATION_REVISION }}
      PRODUCT_VERSION: ${{ inputs.version }}
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Validate distribution credentials before reserving version
        id: distribution
        env:
          S3_ACCESS_KEY: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          S3_SECRET_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.RELEASES_S3_REGION }}
          S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          for name in S3_ACCESS_KEY S3_SECRET_KEY S3_REGION S3_BUCKET; do
            if [ -z "${!name}" ]; then echo "Missing distribution setting: $name" >&2; exit 1; fi
          done
          if [ -n "$TAP_TOKEN" ]; then
            echo 'homebrew_enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'homebrew_enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - id: candidate
        run: bun tooling/delivery/resolve-candidate.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source CI
        run: bun tooling/delivery/native-source.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
      - id: reserve
        run: bun tooling/delivery/product-release.ts reserve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_TAG_TOKEN: ${{ steps.app.outputs.token }}
  native:
    needs: reserve
    if: needs.reserve.outputs.complete == 'false'
    uses: ./.github/workflows/native.build.yml
    permissions:
      contents: write
      actions: read
    with:
      ref: ${{ needs.reserve.outputs.sha }}
      version: ${{ needs.reserve.outputs.version }}
    secrets: inherit
  self-hosted:
    needs: reserve
    if: needs.reserve.outputs.complete == 'false'
    uses: ./.github/workflows/self-host.publish.yml
    permissions:
      contents: write
      packages: write
      actions: read
    with:
      ref: ${{ needs.reserve.outputs.sha }}
      version: ${{ needs.reserve.outputs.version }}
    secrets: inherit
  hosted:
    needs: [reserve, native, self-hosted]
    uses: ./.github/workflows/core.promote.yml
    permissions:
      contents: read
      actions: read
      deployments: write
    with:
      candidate_run_id: ${{ inputs.candidate_run_id }}
      target: core
      stable_release: true
    secrets: inherit
  distribute:
    needs: [reserve, native, hosted]
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        component: [cli, desktop]
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRODUCT_VERSION: ${{ needs.reserve.outputs.version }}
      PRODUCT_GROUP: ${{ matrix.component }}
      LUNARIS_BUILD_SHA: ${{ needs.reserve.outputs.sha }}
      SIGNING_MODE: ${{ needs.native.outputs.signing_mode }}
      VERSION: ${{ needs.reserve.outputs.version }}
      COMPONENT: ${{ matrix.component }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.RELEASES_S3_REGION }}
      RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
      RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
      PRODUCT_RELEASE: 'true'
      HOMEBREW_ENABLED: ${{ needs.reserve.outputs.homebrew_enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.reserve.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun tooling/delivery/product-release.ts restore dist
      - name: Publish CLI to S3
        if: matrix.component == 'cli'
        run: bash tooling/release/publish-s3.sh "$COMPONENT" "$VERSION" "$SIGNING_MODE" dist
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: env.HOMEBREW_ENABLED == 'true'
        with:
          repository: LunarisApp/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - run: bash tooling/release/publish-homebrew.sh "$COMPONENT" "$VERSION" "$SIGNING_MODE" dist homebrew-tap
        if: env.HOMEBREW_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Record deferred Homebrew publication
        if: env.HOMEBREW_ENABLED != 'true'
        run: echo 'Homebrew publication disabled. Native artifacts are attached to GitHub Releases; CLI archives are also available through S3.' >> "$GITHUB_STEP_SUMMARY"
  finalize:
    needs: [reserve, hosted, distribute]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      deployments: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRODUCT_VERSION: ${{ needs.reserve.outputs.version }}
      HOMEBREW_ENABLED: ${{ needs.reserve.outputs.homebrew_enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.reserve.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun tooling/delivery/product-release.ts finalize
