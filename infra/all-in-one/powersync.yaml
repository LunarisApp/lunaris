replication:
  connections:
    - type: postgresql
      uri: !env PS_POSTGRES_SOURCE_URL
      sslmode: disable
storage:
  type: postgresql
  uri: !env PS_POSTGRES_BUCKET_URL
  sslmode: disable
port: 8082
client_auth:
  jwks_uri: http://127.0.0.1:3000/auth/jwks
  audience:
    - !env PS_AUTH_AUD
sync_rules:
  path: sync_rules.yaml
telemetry:
  disable_telemetry_sharing: true
