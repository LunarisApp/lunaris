name: Set up repository Bun
description: Install the exact packageManager version, optionally caching downloads.
inputs:
  cache:
    description: Cache Bun downloads without installing dependencies.
    default: "false"
runs:
  using: composite
  steps:
    - name: Read Bun version
      id: version
      shell: bash
      run: node "$GITHUB_ACTION_PATH/version.cjs"
    - id: install
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.version.outputs.version }}
    - name: Install Bun from npm if GitHub download fails
      if: steps.install.outcome == 'failure'
      shell: bash
      run: |
        set -euo pipefail
        prefix="$RUNNER_TEMP/bun-fallback"
        npm install --prefix "$prefix" --no-save "bun@$BUN_VERSION"
        bin="$prefix/node_modules/.bin"
        if [ "$RUNNER_OS" = Windows ]; then
          bin="$(cygpath -w "$bin")"
        fi
        printf '%s\n' "$bin" >> "$GITHUB_PATH"
    - name: Verify Bun version
      shell: bash
      run: test "$(bun --version)" = "$BUN_VERSION"
    - name: Cache Bun downloads
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ steps.version.outputs.version }}-
