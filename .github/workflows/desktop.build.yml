name: Desktop - Build Windows and Linux
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        default: ''
        type: string
      publish:
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Validate desktop source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      validated_revision: ${{ steps.source.outputs.validated_revision }}
    steps:
      # Keep validation on the workflow revision before executing the requested source.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restrict source to the PR context or trunk history
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_BUILD: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Desktop source must be a full commit SHA' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "$RELEASE_BUILD" = true ] || [ "$SOURCE_REF" != "$EVENT_SHA" ]; then
              echo 'PR builds must use the current PR commit and cannot publish' >&2
              exit 1
            fi
          else
            git merge-base --is-ancestor "$SOURCE_REF" refs/remotes/origin/main
          fi
          sha="$(git rev-parse --verify "$SOURCE_REF^{commit}")"
          printf 'validated_revision=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    permissions:
      contents: read
      actions: read
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            binary: lunaris-desktop.exe
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            binary: lunaris-desktop
    defaults:
      run:
        shell: bash
    env:
      CYPRESS_INSTALL_BINARY: 0
      PRODUCT_VERSION: ${{ inputs.version }}
      PRODUCT_GROUP: desktop-${{ matrix.platform }}
      LUNARIS_BUILD_SHA: ${{ needs.source.outputs.validated_revision }}
      LUNARIS_BUILD_VERSION: ${{ inputs.version }}
      VITE_REGION_DIRECTORY_URL: https://lunaris.app/.well-known/lunaris-regions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.validated_revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Restore immutable release assets
        id: restore
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun tooling/delivery/product-release.ts restore dist
      - name: Install Linux build dependencies
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.restore.outputs.cached != 'true'
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        if: steps.restore.outputs.cached != 'true'
        with:
          workspaces: .
          key: desktop-${{ matrix.target }}
      - name: Set isolated release version
        if: inputs.publish && steps.restore.outputs.cached != 'true'
        run: bun tooling/delivery/product-version.ts
      - name: Install license generator
        if: steps.restore.outputs.cached != 'true'
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Build installer and bundled sidecar
        if: steps.restore.outputs.cached != 'true'
        run: bun run --cwd apps/desktop tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Test native runtime
        if: steps.restore.outputs.cached != 'true'
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bun tooling/mcp-smoke.ts target/${{ matrix.target }}/release/${{ matrix.binary }} lunaris-desktop
          else
            bun tooling/mcp-smoke.ts target/${{ matrix.target }}/release/${{ matrix.binary }} lunaris-desktop
          fi
      - name: Inspect Debian package contents
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Linux'
        run: |
          packages=(target/${{ matrix.target }}/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --extract "${packages[0]}" "$RUNNER_TEMP/desktop-package"
          test -n "$(find "$RUNNER_TEMP/desktop-package" -type f -name lunaris-agent -size +0c -print -quit)"
          test -n "$(find "$RUNNER_TEMP/desktop-package" -type f -name RUST-LICENSES.txt -size +0c -print -quit)"
          test -n "$(find "$RUNNER_TEMP/desktop-package" -type f -name AGENT-${{ matrix.target }}-LICENSES.md -size +0c -print -quit)"
      - name: Install and smoke test Windows installer
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installPath = Join-Path $env:RUNNER_TEMP 'lunaris-installed'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$installPath" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          foreach ($name in @('lunaris-agent.exe', 'RUST-LICENSES.txt', 'AGENT-${{ matrix.target }}-LICENSES.md')) {
            $files = @(Get-ChildItem $installPath -Recurse -File -Filter $name | Where-Object Length -gt 0)
            if ($files.Count -eq 0) { throw "Missing installed resource: $name" }
          }
          bun tooling/mcp-smoke.ts "$installPath/lunaris-desktop.exe" lunaris-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package verified installer
        if: steps.restore.outputs.cached != 'true'
        run: bun tooling/delivery/desktop-artifacts.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.publish && 'release' || 'ci' }}-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
