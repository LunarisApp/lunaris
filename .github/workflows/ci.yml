name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.10

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check formatting and lint
        run: bun run check
      - name: Check generated brand assets
        run: bun run brand:check
      - name: Validate public packages
        run: bun run public:validate
      - name: Validate PowerSync config
        run: bun run powersync:config:check
      - name: Test PowerSync access rules
        run: bun test tooling/powersync-rules.test.ts

  typecheck:
    name: Type safety
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck workspaces
        run: bun run typecheck
      - name: Typecheck tooling
        run: bun run brand:typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test -- --concurrency=4

  editions:
    name: Edition (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [community, enterprise]
    env:
      LUNARIS_EDITION: ${{ matrix.edition }}
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test tooling/editions tooling/licenses
      - run: bun run build --filter=api --filter=web --filter=desktop
      - run: bun tooling/editions/runtime.ts /tmp/lunaris-runtime
      - name: Install production runtime and verify API imports
        working-directory: /tmp/lunaris-runtime
        run: |
          bun install --lockfile-only --ignore-scripts
          bun install --production --frozen-lockfile --ignore-scripts
          cd apps/api
          bun -e 'import "reflect-metadata"; await import("./dist/src/app.module.js")'

  agent-rust:
    name: Agent Rust (macos-14)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build plugin SDK dependencies
        run: bun run build --filter=@lunarisapp/plugin-sdk
      - name: Check generated agent contract
        run: bun run --cwd internal/agent-contracts check:mcp
      - name: Test shared Rust MCP runtime
        run: cargo test -p lunaris-agent-mcp
      - name: Test Rust CLI
        run: cargo test -p lunaris-cli

  desktop-mcp:
    name: Desktop MCP (macos-14)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build Agent Work sidecar
        run: bun run --cwd apps/desktop build:agent
      - name: Build bundled executable
        run: cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml --bin lunaris-desktop
      - name: Smoke test bundled executable
        run: bun tooling/mcp-smoke.ts target/release/lunaris-desktop lunaris-desktop
