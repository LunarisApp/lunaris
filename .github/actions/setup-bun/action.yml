name: Set up repository Bun
description: Install the exact packageManager version, optionally caching downloads.
inputs:
  cache:
    description: Cache Bun downloads without installing dependencies.
    default: "false"
runs:
  using: composite
  steps:
    - name: Read Bun version
      id: version
      shell: bash
      run: node "$GITHUB_ACTION_PATH/version.cjs"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.version.outputs.version }}
    - name: Cache Bun downloads
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ steps.version.outputs.version }}-
