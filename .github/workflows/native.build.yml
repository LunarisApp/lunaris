name: Native - Build stable artifacts
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      signing_mode:
        value: ${{ jobs.signing.outputs.mode }}
permissions:
  actions: read
  contents: write
env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
jobs:
  signing:
    environment: release
    name: Select signing mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      cli_platform_archives: ${{ steps.cli-platforms.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: cli-platforms
        name: Check candidate CLI packaging support
        run: |
          if [ -f tooling/delivery/cli-artifacts.sh ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-bun
      - id: mode
        name: Validate Apple credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bun tooling/release/signing-mode.ts

  build-cli:
    environment: release
    name: Build CLI
    needs: signing
    # Keep universal builds off the capacity-constrained hosted ARM64 pool.
    runs-on: macos-15-intel
    permissions:
      contents: write
      actions: read
    env:
      PRODUCT_VERSION: ${{ inputs.version }}
      PRODUCT_GROUP: cli
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LUNARIS_BUILD_SHA: ${{ inputs.ref }}
      LUNARIS_SIGNING_MODE: ${{ needs.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check out current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .delivery-tools
          sparse-checkout: |
            tooling/delivery
            tooling/release/automation
      - uses: ./.github/actions/setup-bun
      - id: restore
        run: bun install --frozen-lockfile --ignore-scripts && bun .delivery-tools/tooling/delivery/product-release.ts restore dist
      - name: Reject cached ad-hoc release assets
        shell: bash
        run: |
          if find dist -type f -name '*-adhoc.*' -print -quit | grep -q .; then
            echo 'Cached ad-hoc artifacts cannot be published as signed. Reserve a fresh release version.' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.restore.outputs.cached != 'true'
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: steps.restore.outputs.cached != 'true'
        with:
          workspaces: .
      - run: bun install --frozen-lockfile
        if: steps.restore.outputs.cached != 'true'
      - name: Set isolated build versions
        if: steps.restore.outputs.cached != 'true'
        run: bun tooling/delivery/product-version.ts
      - run: bun run release:validate
        if: steps.restore.outputs.cached != 'true'
      - name: Install license generator
        if: steps.restore.outputs.cached != 'true'
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - run: cargo test --locked --manifest-path apps/cli/Cargo.toml
        if: steps.restore.outputs.cached != 'true'
      - name: Build universal executable
        if: steps.restore.outputs.cached != 'true'
        run: |
          cargo build --release --locked --manifest-path apps/cli/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --locked --manifest-path apps/cli/Cargo.toml --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/lunaris \
            target/x86_64-apple-darwin/release/lunaris \
            -output dist/lunaris
          lipo -info dist/lunaris
      - name: Import Developer ID certificate
        if: steps.restore.outputs.cached != 'true' && needs.signing.outputs.mode == 'signed'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/apple-certificate.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
      - name: Sign CLI
        if: steps.restore.outputs.cached != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/lunaris
          codesign --verify --strict --verbose=2 dist/lunaris
      - name: Smoke test final CLI
        if: steps.restore.outputs.cached != 'true'
        run: |
          dist/lunaris --version
          bun tooling/mcp-smoke.ts dist/lunaris
      - name: Package CLI
        if: steps.restore.outputs.cached != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          asset="lunaris-cli-${VERSION}-universal-apple-darwin.zip"
          package_dir="dist/lunaris-cli-${VERSION}"
          mkdir -p "$package_dir"
          cp dist/lunaris "$package_dir/lunaris"
          cp apps/cli/LICENSE "$package_dir/LICENSE"
          cargo about generate \
            --manifest-path apps/cli/Cargo.toml \
            --config apps/cli/about.toml \
            --locked \
            --fail \
            --output-file "$package_dir/THIRD-PARTY-LICENSES.txt" \
            apps/cli/about.hbs
          (cd "$package_dir" && zip -9 "../$asset" lunaris LICENSE THIRD-PARTY-LICENSES.txt)
          unzip -t "dist/$asset"
          (cd dist && shasum -a 256 "$asset" > SHA256SUMS)
          echo "asset=$asset" >> "$GITHUB_ENV"
      - name: Notarize CLI archive
        if: steps.restore.outputs.cached != 'true' && needs.signing.outputs.mode == 'signed'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          xcrun notarytool submit "dist/$asset" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          # Gatekeeper app assessment rejects standalone command-line executables.
          codesign --verify --strict --check-notarization --verbose=2 dist/lunaris
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.restore.outputs.cached != 'true'
        with:
          overwrite: true
          name: release-cli
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Clean up Apple signing credentials
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/apple-certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Persist immutable product assets
        run: bun .delivery-tools/tooling/delivery/product-release.ts upload dist

  build-cli-platforms:
    name: Build CLI (${{ matrix.platform }})
    needs: signing
    if: needs.signing.outputs.cli_platform_archives == 'true'
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: lunaris.exe
          - platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: lunaris
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: lunaris
    defaults:
      run:
        shell: bash
    env:
      PRODUCT_VERSION: ${{ inputs.version }}
      PRODUCT_GROUP: cli-${{ matrix.platform }}
      LUNARIS_BUILD_SHA: ${{ inputs.ref }}
      LUNARIS_SIGNING_MODE: unsigned
      CYPRESS_INSTALL_BINARY: 0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check out current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .delivery-tools
          sparse-checkout: |
            tooling/delivery
            tooling/release/automation
      - uses: ./.github/actions/setup-bun
      - id: restore
        run: bun install --frozen-lockfile --ignore-scripts && bun .delivery-tools/tooling/delivery/product-release.ts restore dist
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.restore.outputs.cached != 'true'
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: steps.restore.outputs.cached != 'true'
        with:
          workspaces: .
          key: cli-${{ matrix.target }}
      - name: Set isolated build versions
        if: steps.restore.outputs.cached != 'true'
        run: bun tooling/delivery/product-version.ts
      - name: Install Linux license generator
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Linux'
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Install Windows license generator
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          asset=cargo-about-0.9.1-x86_64-pc-windows-msvc
          curl --fail --location --retry 3 --output "$asset.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.1/$asset.tar.gz"
          echo "318893aff6b9efd60f70470f5827b9577ae20a805cf9732d5612862a78508581 *$asset.tar.gz" | sha256sum -c -
          tar -xzf "$asset.tar.gz" "$asset/cargo-about.exe"
          PATH="$PWD/$asset:$PATH" cargo about --version
          cygpath -aw "$asset" >> "$GITHUB_PATH"
      - name: Test and build CLI
        if: steps.restore.outputs.cached != 'true'
        run: |
          cargo test --locked -p lunaris-cli --target ${{ matrix.target }}
          cargo build --release --locked -p lunaris-cli --target ${{ matrix.target }}
      - name: Smoke test final CLI
        if: steps.restore.outputs.cached != 'true'
        run: |
          binary=target/${{ matrix.target }}/release/${{ matrix.binary }}
          "$binary" --version
          bun tooling/mcp-smoke.ts "$binary"
      - name: Package CLI
        if: steps.restore.outputs.cached != 'true'
        run: bash tooling/delivery/cli-artifacts.sh ${{ matrix.target }}
      - name: Smoke test Windows CLI installer
        if: steps.restore.outputs.cached != 'true' && runner.os == 'Windows'
        shell: powershell
        run: ./tooling/delivery/cli-install-smoke.ps1 -Version $env:PRODUCT_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.restore.outputs.cached != 'true'
        with:
          overwrite: true
          name: release-${{ env.PRODUCT_GROUP }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Persist immutable product assets
        run: bun .delivery-tools/tooling/delivery/product-release.ts upload dist

  build-desktop:
    environment: release
    name: Build Desktop
    needs: signing
    # Both Rust targets and Bun sidecars cross-compile on the Intel runner.
    runs-on: macos-15-intel
    permissions:
      contents: write
      actions: read
    env:
      PRODUCT_VERSION: ${{ inputs.version }}
      PRODUCT_GROUP: desktop
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LUNARIS_BUILD_SHA: ${{ inputs.ref }}
      LUNARIS_BUILD_VERSION: ${{ inputs.version }}
      LUNARIS_SIGNING_MODE: ${{ needs.signing.outputs.mode }}
      VITE_REGION_DIRECTORY_URL: https://lunaris.app/.well-known/lunaris-regions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check out current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .delivery-tools
          sparse-checkout: |
            tooling/delivery
            tooling/release/automation
      - uses: ./.github/actions/setup-bun
      - id: restore
        run: bun install --frozen-lockfile --ignore-scripts && bun .delivery-tools/tooling/delivery/product-release.ts restore dist
      - name: Reject cached ad-hoc release assets
        shell: bash
        run: |
          if find dist -type f -name '*-adhoc.*' -print -quit | grep -q .; then
            echo 'Cached ad-hoc artifacts cannot be published as signed. Reserve a fresh release version.' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.restore.outputs.cached != 'true'
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: steps.restore.outputs.cached != 'true'
        with:
          workspaces: .
      - run: bun install --frozen-lockfile
        if: steps.restore.outputs.cached != 'true'
      - name: Set isolated build versions
        if: steps.restore.outputs.cached != 'true'
        run: bun tooling/delivery/product-version.ts
      - run: bun run release:validate
        if: steps.restore.outputs.cached != 'true'
      - name: Install license generator
        if: steps.restore.outputs.cached != 'true'
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Build plugin SDK for Agent sidecar
        if: steps.restore.outputs.cached != 'true'
        run: bun run --cwd packages/plugin-sdk build
      - name: Build Agent sidecar
        if: steps.restore.outputs.cached != 'true'
        run: bun run --cwd apps/desktop build:agent
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
        if: steps.restore.outputs.cached != 'true'
      - name: Configure Developer ID signing
        if: steps.restore.outputs.cached != 'true' && needs.signing.outputs.mode == 'signed'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          certificate="$RUNNER_TEMP/apple-certificate.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - name: Configure signed updater
        if: steps.restore.outputs.cached != 'true'
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun .delivery-tools/tooling/delivery/desktop-updater-config.ts
      - name: Build universal Desktop app
        if: steps.restore.outputs.cached != 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --cwd apps/desktop tauri:build -- --target universal-apple-darwin --bundles app,dmg --config ../../artifacts/desktop-updater.conf.json
      - name: Notarize Desktop disk image
        if: steps.restore.outputs.cached != 'true' && needs.signing.outputs.mode == 'signed'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          # Tauri notarizes the app before creating and signing the disk image.
          # Submit the final DMG separately so its own Gatekeeper assessment passes.
          dmg_path="$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"
      - name: Verify Desktop bundle
        if: steps.restore.outputs.cached != 'true'
        shell: bash
        run: |
          app_path="$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          for notice in LICENSE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md EXTEND-LICENSE.txt RUST-LICENSES.txt BUN-RUNTIME.md AGENT-aarch64-apple-darwin-LICENSES.md AGENT-x86_64-apple-darwin-LICENSES.md; do
            test -s "$app_path/Contents/Resources/notices/$notice"
          done
          binary="$app_path/Contents/MacOS/lunaris-desktop"
          lipo -info "$binary"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          sidecar="$app_path/Contents/MacOS/lunaris-agent"
          codesign --verify --strict --verbose=2 "$sidecar"
          codesign --display --entitlements - --xml "$sidecar" > "$RUNNER_TEMP/agent-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' "$RUNNER_TEMP/agent-entitlements.plist" | grep -qx true
          bun tooling/delivery/agent-work-smoke.ts "$sidecar"
          bun tooling/mcp-smoke.ts "$binary" lunaris-desktop

          "$binary" > "$RUNNER_TEMP/desktop-launch.log" 2>&1 &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true

          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg_path" -nobrowse -mountpoint "$mount_point"
          test -d "$mount_point/Lunaris.app"
          codesign --verify --deep --strict --verbose=2 "$mount_point/Lunaris.app"
          hdiutil detach "$mount_point"

          if [ "$LUNARIS_SIGNING_MODE" = "signed" ]; then
            spctl --assess --type execute --verbose=2 "$app_path"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"
            xcrun stapler validate "$app_path"
            xcrun stapler validate "$dmg_path"
          fi

      - name: Package verified Desktop artifacts
        if: steps.restore.outputs.cached != 'true'
        run: bun .delivery-tools/tooling/delivery/desktop-artifacts.ts universal-apple-darwin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.restore.outputs.cached != 'true'
        with:
          overwrite: true
          name: release-desktop
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.sig
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Clean up Apple signing credentials
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/apple-certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Persist immutable product assets
        run: bun .delivery-tools/tooling/delivery/product-release.ts upload dist

  build-desktop-platforms:
    uses: ./.github/workflows/desktop.build.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      publish: true
    secrets: inherit

  persist-desktop-platforms:
    needs: build-desktop-platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ windows, linux ]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRODUCT_VERSION: ${{ inputs.version }}
      PRODUCT_GROUP: desktop-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Check out current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .delivery-tools
          sparse-checkout: |
            tooling/delivery
            tooling/release/automation
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-desktop-${{ matrix.platform }}
          path: dist
      - name: Persist immutable product assets
        run: bun .delivery-tools/tooling/delivery/product-release.ts upload dist
